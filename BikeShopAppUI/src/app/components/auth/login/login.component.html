<main>
  <div class="container">
    <div class="main-container">
      <h1>Login</h1>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="">Email</label>
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <div>
              <small class="error-message">Email is Required</small>
            </div>
          }
          <input type="text" formControlName="email">
        </div>

        <div class="form-group">
          <label for="">Password</label>
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <div>
              <small class="error-message">Password is Required</small>
            </div>
          }
          <div class="password-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password">

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword">
              👁
            </button>
          </div>
        </div>

        <div class="btn-container-row mt-2">
          <a [routerLink]="['/home']" class="btn">Back</a>
          <button type="submit" class="btn" [disabled]="loginForm.invalid">Submit</button>
        </div>
      </form>
    </div>
  </div>
</main>
