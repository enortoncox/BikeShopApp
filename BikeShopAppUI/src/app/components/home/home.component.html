<main>
  <div class="container">
    <div class="main-container">
      <h1>Welcome to Mega Cycles</h1>

      <div class="categories-container">
        @for (item of categoriesLinks; track item) {
          <a routerLink="/products" [queryParams]="item.params" class="cat-btn">{{item.name}}</a>
        }
      </div>
    </div>

  </div>
</main>
